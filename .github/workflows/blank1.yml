name: Update GitHub Profile

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # GITHUB STATS
      # =========================
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=LucasF89k&show_icons=true&include_all_commits=true&count_private=true&theme=dark
          path: profile/stats.svg
          token: ${{ secrets.SNAKE_TOKEN }}

      # =========================
      # TOP LANGUAGES
      # =========================
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=LucasF89k&layout=compact&langs_count=5&theme=dark
          path: profile/top-langs.svg
          token: ${{ secrets.SNAKE_TOKEN }}

      # =========================
      # SNAKE
      # =========================
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LucasF89k
          github_token: ${{ secrets.SNAKE_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=%238B5CF6&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353
            dist/snake-dark.svg?color_snake=%238B5CF6&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353

      # =========================
      # SALVAR STATS NO MAIN
      # =========================
      - name: Commit profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git diff --cached --quiet || git commit -m "Update profile stats"

          git push

      # =========================
      # PUBLICAR SNAKE
      # =========================
      - name: Push snake SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
